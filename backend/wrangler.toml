name = "stoit-refresh"
main = "worker.js"
compatibility_date = "2026-11-22"
workers_dev = true

[vars]
GITHUB_REPO = "MaxDdonich/stoit"
WORKFLOW_FILE = "update.yml"
GITHUB_REF = "main"
ALLOWED_ORIGINS = "https://maxddonich.github.io,http://localhost:8787"
COOLDOWN_SECONDS = "1200"

# Рекомендуется для строгого общего лимита:
# создайте KV namespace в Cloudflare и добавьте binding RATE_LIMIT.
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Секрет GITHUB_TOKEN не хранится в этом файле:
# wrangler secret put GITHUB_TOKEN
# или Cloudflare Dashboard → Worker → Settings → Variables → Encrypt.
