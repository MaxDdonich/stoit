<!doctype html>
<html lang="ru" data-theme="dark" data-style="raid">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      var style = "raid";
      try {
        var saved = localStorage.getItem("stoit.style");
        if (saved === "classic" || saved === "raid") style = saved;
      } catch (e) {}
      document.documentElement.setAttribute("data-style", style);
      window.__stoitStyle = style;
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0a07">
  <meta name="description" content="СТОИТ — гид по Москве: недорогие кафе, выставки, игры и прогулки. Честные цены за конкретную услугу, 30+ источников и каталогов, обновление каждый день.">
  <title>СТОИТ — Москва, в которую стоит сходить</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Handjet:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="stylesheet" href="assets/app.css?v=58">
  <link id="raid-theme" rel="stylesheet" href="assets/raid.css?v=58">
  <script>
    (function () {
      var link = document.getElementById("raid-theme");
      if (link && window.__stoitStyle !== "raid") link.disabled = true;
    })();
  </script>
  <meta property="og:title" content="СТОИТ — Москва, в которую стоит сходить">
  <meta property="og:description" content="Кафе, выставки, игры и прогулки — от бесплатных до особого случая. 30+ источников и каталогов, обновление каждый день.">
  <meta property="og:type" content="website">
</head>
<body>
  <div class="splash" id="splash" role="status" aria-live="polite">
    <div class="splash-glow" aria-hidden="true"></div>
    <div class="splash-word">стоит<span>.</span></div>
    <div class="splash-line" aria-hidden="true"><i></i></div>
    <p data-i18n="boot.loading">Собираем Москву…</p>
  </div>

  <a class="skip-link" href="#view" data-i18n="a11y.skip">К содержанию</a>

  <header class="site-header" id="site-header"></header>

  <div class="price-warning" role="note">
    <span class="price-warning-dot" aria-hidden="true"></span>
    <span data-i18n="warning.prices">Цены и наличие мест лучше сверять перед выходом — они собраны из открытых источников и могут меняться.</span>
  </div>

  <main id="view" class="view" tabindex="-1">
    <div class="boot" id="boot">
      <div class="boot-mark">стоит<span>.</span></div>
      <div class="boot-line"><i></i></div>
      <p data-i18n="boot.loading">Собираем Москву…</p>

  <script src="assets/config.js?v=1"></script>

</html>
